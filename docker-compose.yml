# Dashboard and experiment runner use the SAME image: FastAPI serves the static frontend.
# Run with `docker compose up --build -d dashboard`.
services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-become-human:local
    command:
      - python
      - -m
      - detroit_benchmark
      - dashboard
      - --runs-dir
      - /app/saved_runs
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Visitors can play their own Runs (ADR 0003); they are saved in ./visitor_runs.
      - --allow-own-runs
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8000}:8000"
    volumes:
      # Sibling folders: a mount nested inside a read-only one fails on a fresh clone.
      - ./runs:/app/saved_runs/runs:ro
      # Visitor Runs: the one writable folder under the runs root (gitignored).
      - ./visitor_runs:/app/saved_runs/visitor-runs
      - ./data:/app/data:ro
    restart: unless-stopped

  # On-demand worker/CLI, not automatically started by `up` (avoids accidental API bills).
  # Example: docker compose run --rm runner play /app/data/detroit-unverified.json ...
  runner:
    image: llm-become-human:local
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    entrypoint: ["python", "-m", "detroit_benchmark"]
    command: ["--help"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data
      - ./upstream-detroit:/app/upstream-detroit:ro
