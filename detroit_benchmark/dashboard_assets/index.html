<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fa">
  <title>Decision Atlas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="chapter-rail" aria-label="Chapter navigation">
      <div class="brand-lockup">
        <div class="atlas-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div class="brand-type"><strong>DECISION<span>ATLAS</span></strong></div>
      </div>
      <div class="rail-chapters" id="chapterList" role="navigation" aria-label="Chapters"></div>
    </aside>

    <div class="main-panel">
      <main class="workspace">
        <div class="chapter-heading">
          <div class="chapter-heading-text">
            <div class="chapter-kicker"><span class="kicker-bar"></span><span id="chapterIndexLabel"></span></div>
            <h1 id="chapterTitle"></h1>
            <div class="chapter-summary"><span id="chapterSubtitle"></span></div>
          </div>
          <div class="view-tabs" role="group" aria-label="Choose a view">
            <button type="button" id="viewStory" data-view="story" aria-pressed="true">Story</button>
            <button type="button" id="viewFlow" data-view="flow" aria-pressed="false">Flowchart</button>
          </div>
        </div>

        <section class="control-strip" aria-label="Models">
          <div class="picker-anchor" id="pickerContainer">
            <button id="pickerToggle" type="button" class="picker-toggle" aria-expanded="false" aria-controls="pickerPanel" aria-label="Choose models"><strong>Models</strong><span class="picker-chevron">⌄</span></button>
            <div class="picker-panel is-hidden" id="pickerPanel" role="group" aria-label="Choose models">
              <div class="picker-search-wrap"><span aria-hidden="true">⌕</span><input id="searchRuns" type="search" autocomplete="off" placeholder="Search" aria-label="Search models"></div>
              <div class="picker-actions"><button id="selectAllRuns" type="button">Select all</button><button id="clearRuns" type="button">Clear</button></div>
              <div class="picker-list" id="pickerList"></div>
            </div>
          </div>
          <div id="selectedRunChips" class="selected-run-chips" aria-label="Shown models"></div>
        </section>

        <section class="story-view" id="storyView" aria-label="Story">
          <div class="story-toolbar">
            <label class="reader-picker">Following <select id="readerRun"></select></label>
            <div class="story-mode" role="group" aria-label="How much of the story to show">
              <button type="button" id="modeFull" aria-pressed="true">Full story</button>
              <button type="button" id="modeKey" aria-pressed="false">Decisions only</button>
            </div>
            <div class="decision-strip" id="decisionStrip" aria-label="Jump to a decision"></div>
          </div>
          <div class="story-scroll" id="storyScroll" tabindex="0"><div class="story-content" id="storyContent"></div></div>
        </section>

        <div class="viewer-wrap is-hidden" id="viewerWrap">
          <section class="flow-viewport" id="viewport" aria-label="Flowchart">
            <div class="canvas-background" aria-hidden="true"></div>
            <div id="graphWorld" class="graph-world"><svg id="graphEdges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg><div id="graphNodes" class="graph-nodes"></div></div>
            <div id="graphNotice" class="graph-notice is-hidden" role="status"></div>
            <div id="graphEmpty" class="graph-empty" role="status"></div>
            <details class="canvas-legend" id="canvasLegend"><summary class="legend-title">Models</summary></details>
            <div class="canvas-zoombar" aria-label="Zoom"><button id="zoomIn" aria-label="Zoom in" type="button">+</button><span id="zoomLabel">100%</span><button id="zoomOut" aria-label="Zoom out" type="button">−</button><button id="zoomReset" class="reset-button" aria-label="Fit" title="Fit" type="button">⌗</button></div>
          </section>

          <aside id="reasoningDrawer" class="reasoning-drawer is-hidden" aria-label="Decision">
            <div class="drawer-top"><span></span><button id="closeDrawer" class="drawer-close" type="button" aria-label="Close">×</button></div>
            <div id="drawerContent" class="drawer-content"></div>
          </aside>
        </div>
      </main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/assets/story.js" defer></script>
  <script src="/assets/app.js" defer></script>
</body>
</html>
