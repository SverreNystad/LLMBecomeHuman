<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef0f2">
  <title>LLM: Become Human</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%232f8ce6' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/backdrop.css">
  <link rel="stylesheet" href="/assets/title.css">
  <link rel="stylesheet" href="/assets/unfold.css">
  <script src="/assets/title.js"></script>
  <link rel="stylesheet" href="/assets/portraits.css">
  <link rel="stylesheet" href="/assets/story-marks.css">
  <link rel="stylesheet" href="/assets/glitch.css">
  <link rel="stylesheet" href="/assets/motion.css">
</head>
<body data-character="none">
  <!-- Background layer: later layers (scene art, node network) mount inside here. -->
  <div class="backdrop" id="backdrop" aria-hidden="true">
    <div class="backdrop-art" id="backdropArt"></div>
    <div class="backdrop-network" id="backdropNetwork"></div>
    <div class="backdrop-veil"></div>
  </div>

  <div class="app-shell" id="appShell">
    <aside class="chapter-rail" aria-label="Chapters">
      <div class="brand">
        <svg class="led-ring" viewBox="0 0 40 40" aria-hidden="true">
          <circle class="led-ring-glow" cx="20" cy="20" r="13"/>
          <circle class="led-ring-light" cx="20" cy="20" r="13"/>
          <circle class="led-ring-core" cx="20" cy="20" r="7.5"/>
        </svg>
        <span class="brand-name"><b class="brand-llm">LLM</b> Become Human</span>
      </div>
      <nav class="rail-chapters" id="chapterList" aria-label="Chapters"></nav>
    </aside>

    <div class="main-panel">
      <main class="workspace">
        <header class="chapter-heading">
          <div class="chapter-heading-text">
            <div class="chapter-kicker" id="chapterIndexLabel"></div>
            <h1 id="chapterTitle"></h1>
            <div class="chapter-character" id="chapterSubtitle"></div>
          </div>
          <div class="view-tabs" role="group" aria-label="View">
            <button type="button" id="viewStory" data-view="story" aria-pressed="true">Story</button>
            <button type="button" id="viewFlow" data-view="flow" aria-pressed="false">Flowchart</button>
          </div>
        </header>

        <section class="control-strip" aria-label="Models">
          <div class="picker-anchor" id="pickerContainer">
            <button id="pickerToggle" type="button" class="picker-toggle" aria-expanded="false" aria-controls="pickerPanel" aria-label="Choose models" title="Choose models">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <div class="picker-panel is-hidden" id="pickerPanel" role="group" aria-label="Choose models">
              <input id="searchRuns" class="picker-search" type="search" autocomplete="off" placeholder="Search" aria-label="Search models">
              <div class="picker-list" id="pickerList"></div>
              <div class="picker-actions"><button id="bestOfEach" type="button" title="The best model of each provider">Best of each</button><button id="clearRuns" type="button">Clear</button></div>
            </div>
          </div>
          <div id="selectedRunChips" class="selected-run-chips" aria-label="Shown models"></div>
        </section>

        <section class="story-view" id="storyView" aria-label="Story">
          <div class="story-toolbar">
            <div class="story-run-picker" id="storyRunPicker">
              <button type="button" id="storyRun" class="story-run-button" aria-haspopup="menu" aria-expanded="false" aria-controls="storyRunMenu" aria-label="Following"></button>
              <div class="story-run-menu is-hidden" id="storyRunMenu" role="menu" aria-label="Following"></div>
            </div>
            <button type="button" id="storyMode" class="icon-toggle" aria-pressed="false" aria-label="Decisions only" title="Decisions only">
              <svg class="icon-full" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 10h14M5 14h14M5 18h9"/></svg>
              <svg class="icon-key" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="7" r="2"/><circle cx="7" cy="17" r="2"/><path d="M12 7h7M12 17h7"/></svg>
            </button>
            <div class="decision-strip" id="decisionStrip" aria-label="Jump to a decision"></div>
          </div>
          <div class="story-scroll" id="storyScroll" tabindex="0"><div class="story-content" id="storyContent"></div></div>
        </section>

        <div class="viewer-wrap is-hidden" id="viewerWrap">
          <section class="flow-viewport" id="viewport" aria-label="Flowchart">
            <div id="graphWorld" class="graph-world"><svg id="graphEdges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg><div id="graphNodes" class="graph-nodes"></div></div>
            <div id="graphNotice" class="graph-notice is-hidden" role="status"></div>
            <div id="graphEmpty" class="graph-empty" role="status"></div>
            <details class="canvas-legend" id="canvasLegend"><summary class="legend-title">Models</summary></details>
            <div class="canvas-zoombar" aria-label="Zoom"><button id="zoomIn" aria-label="Zoom in" title="Zoom in" type="button">+</button><button id="zoomOut" aria-label="Zoom out" title="Zoom out" type="button">−</button><button id="zoomReset" aria-label="Fit" title="Fit" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M4 16v4h4M20 16v4h-4"/></svg></button></div>
          </section>

          <aside id="reasoningDrawer" class="reasoning-drawer is-hidden" aria-label="Moment">
            <button id="closeDrawer" class="drawer-close" type="button" aria-label="Close" title="Close">×</button>
            <div id="drawerContent" class="drawer-content"></div>
          </aside>
        </div>
      </main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/assets/characters.js" defer></script>
  <script src="/assets/backdrop.js" defer></script>
  <script src="/assets/sound.js" defer></script>
  <script src="/assets/unfold.js" defer></script>
  <script src="/assets/portraits.js" defer></script>
  <script src="/assets/memory.js" defer></script>
  <script src="/assets/story.js" defer></script>
  <script src="/assets/app.js" defer></script>
</body>
</html>
