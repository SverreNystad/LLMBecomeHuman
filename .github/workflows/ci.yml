name: Continuous Integration

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    pull-requests: write
    contents: write

env:
    PYTHON_VERSION: "3.12"

jobs:
    build-and-test-python:
        name: continuous-integration
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: "Set up Python"
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true

            - name: Run pre-commit hooks (optional)
              run: |
                  uv pip install --system pre-commit
                  pre-commit run --all-files || true
              continue-on-error: true

            - name: Install and sync dependencies
              run: |
                  uv sync --locked --all-extras

            - name: Run root tests
              run: |
                  uv run pytest --doctest-modules --cov=src --cov-report=html

    build-and-test-docker:
        name: continuous-integration
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Run docker compose build
              run: |
                  docker compose up --build -d
                  docker compose down
            - name: Run tests in docker compose
              run: |
                  docker compose run --rm --build --entrypoint pytest runner -q

    deploy:
        name: Deploy to GitHub Pages
        needs: [build-and-test-python, build-and-test-docker]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: "Set up Python"
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true
            - name: Install and sync dependencies
              run: |
                  uv sync --group=docs --locked

            - name: Configure Git Credentials
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
            - run: uv run mkdocs gh-deploy --force

    dependabot:
        name: "Dependabot"
        needs: [build-and-test-python, build-and-test-docker]
        runs-on: ubuntu-latest
        if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'}}
        steps:
            - name: Enable auto-merge for Dependabot PRs
              # Uses Github CLI to automatically merge the PR if test passes
              run: gh pr merge --auto --merge "$PR_URL"
              env:
                  PR_URL: ${{github.event.pull_request.html_url}}
                  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    push-image:
        name: Push Docker images
        needs: [build-and-test]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract short SHA
              id: git_sha
              run: echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Build and Push Docker Backend Image
              run: |
                  docker build -t ghcr.io/sverrenystad/eit-backend:${{ env.GIT_SHA }} ./backend
                  docker push ghcr.io/sverrenystad/eit-backend:${{ env.GIT_SHA }}

            - name: Build and Push Docker Client Image
              run: |
                  docker build -t ghcr.io/sverrenystad/eit-client:${{ env.GIT_SHA }} ./client/
                  docker push ghcr.io/sverrenystad/eit-client:${{ env.GIT_SHA }}
