name: Continuous Integration

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    pull-requests: write
    contents: write

env:
    PYTHON_VERSION: "3.12"

jobs:
    build-and-test-python:
        name: continuous-integration
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: "Set up Python"
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true

            - name: Run pre-commit hooks (optional)
              run: |
                  uv pip install --system pre-commit
                  pre-commit run --all-files || true
              continue-on-error: true

            - name: Install and sync dependencies
              run: |
                  uv sync --locked --all-extras

            - name: Run root tests
              run: |
                  uv run pytest -n auto --doctest-modules --cov=src --cov-report=html

    build-and-test-docker:
        name: continuous-integration
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # The full test suite already runs in the Python job; here we only check the
            # image builds and the dashboard serves inside it.
            - name: Build image
              run: docker compose build dashboard
            - name: Smoke test dashboard
              run: |
                  docker compose up -d dashboard
                  for i in $(seq 1 30); do
                      curl -fsS http://127.0.0.1:8000/api/health && exit 0
                      sleep 2
                  done
                  docker compose logs dashboard
                  exit 1
            - name: Stop dashboard
              if: always()
              run: docker compose down

    deploy:
        name: Deploy to GitHub Pages
        needs: [build-and-test-python, build-and-test-docker]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: "Set up Python"
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true
            - name: Install and sync dependencies
              run: |
                  uv sync --group=docs --locked

            - name: Configure Git Credentials
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
            - run: uv run mkdocs gh-deploy --force

    dependabot:
        name: "Dependabot"
        needs: [build-and-test-python, build-and-test-docker]
        runs-on: ubuntu-latest
        if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'}}
        steps:
            - name: Enable auto-merge for Dependabot PRs
              # Uses Github CLI to automatically merge the PR if test passes
              run: gh pr merge --auto --merge "$PR_URL"
              env:
                  PR_URL: ${{github.event.pull_request.html_url}}
                  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    push-image:
        name: Push Docker image
        needs: [build-and-test-python, build-and-test-docker]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            # QEMU lets buildx build the arm64 image (Raspberry Pi) on this amd64 runner.
            - uses: docker/setup-qemu-action@v3

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/sverrenystad/llmbecomehuman
                  tags: |
                      type=sha
                      type=raw,value=latest

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  # Multi-arch manifest: clusters pull the variant matching their nodes.
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
