[project]
name = "llm-become-human"
version = "0.1.0"
description = "Benchmark LLM decisions in a branching text version of Detroit: Become Human"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.9,<3",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "langchain-anthropic>=0.3,<2",
    "langchain-google-genai>=2,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.8.0",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-api-autonav>=0.3.0",
    "mkdocs-autoapi>=0.4.1",
    "mkdocs-awesome-nav>=3.1.2",
    "mkdocs-include-markdown-plugin>=7.3.1",
    "mkdocs-material>=9.6.16",
    "mkdocstrings>=0.30.0",
    "mkdocstrings-python>=1.16.12",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.uv]
# Run straight from the source tree; no build step needed.
package = false
