[project]
name = "llm-become-human"
version = "0.1.0"
description = "Benchmark LLM decisions in a branching text version of Detroit: Become Human"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.9,<3",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "langchain-anthropic>=0.3,<2",
    "langchain-google-genai>=2,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
# Run straight from the source tree; no build step needed.
package = false
