apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-become-human.fullname" . }}
  labels:
    {{- include "llm-become-human.labels" . | nindent 4 }}
  {{- if .Values.keel.enabled }}
  annotations:
    # Keel (https://keel.sh) polls the registry and rolls this Deployment out when the
    # image behind the current tag changes (e.g. a new "latest" pushed by CI).
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: {{ .Values.keel.pollSchedule | quote }}
  {{- end }}
spec:
  {{- if .Values.visitorRuns.persistence.enabled }}
  {{- if or .Values.autoscaling.enabled (gt (int .Values.replicaCount) 1) }}
  {{- fail "visitorRuns.persistence needs a single pod: set replicaCount to 1 and autoscaling.enabled to false" }}
  {{- end }}
  # One pod owns the Visitor Runs volume: stop the old pod before starting the new one.
  strategy:
    type: Recreate
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "llm-become-human.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "llm-become-human.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "llm-become-human.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- if .Values.visitorRuns.allowOwnRuns }}
          # The image's CMD plus --allow-own-runs (the image has no ENTRYPOINT, so args replaces CMD).
          args: ["python", "-m", "detroit_benchmark", "dashboard", "--runs-dir", "/app/saved_runs", "--host", "0.0.0.0", "--port", "{{ .Values.containerPort }}", "--allow-own-runs"]
          {{- if not .Values.visitorRuns.persistence.enabled }}
          {{- fail "visitorRuns.allowOwnRuns needs visitorRuns.persistence.enabled, or Visitor Runs are lost on every redeploy" }}
          {{- end }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.volumeMounts .Values.visitorRuns.persistence.enabled }}
          volumeMounts:
            {{- if .Values.visitorRuns.persistence.enabled }}
            - name: visitor-runs
              mountPath: {{ .Values.visitorRuns.persistence.mountPath }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.volumes .Values.visitorRuns.persistence.enabled }}
      volumes:
        {{- if .Values.visitorRuns.persistence.enabled }}
        - name: visitor-runs
          persistentVolumeClaim:
            claimName: {{ include "llm-become-human.visitorRunsClaimName" . }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
